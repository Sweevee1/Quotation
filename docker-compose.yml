services:
  quotation:
    build: .
    image: quotation-bot
    container_name: quotation-bot
    ports:
      # Loopback only. For LAN access use "8766:8766". Never forward this port on your router;
      # publish it through a Cloudflare Tunnel instead.
      - "127.0.0.1:8766:8766"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
