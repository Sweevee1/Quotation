services:
  quotation:
    build: .
    image: quotation-bot
    container_name: quotation-bot
    ports:
      - "8766:8766"
      # Uncomment along with TLS_PORT below if you have no reverse-proxy TLS termination and
      # need Twitch OAuth to work — see README's "HTTPS for Twitch OAuth" section.
      # - "8767:8767"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=8766
      - DATA_DIR=/app/data
      - NODE_ENV=production
      # - TLS_PORT=8767
      # - PUBLIC_URL=https://your-server-address:8767
    restart: unless-stopped
